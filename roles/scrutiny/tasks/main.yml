---

- name: Assert that all required inputs have been provided.
  ansible.builtin.assert:
    that:
      - tesseract_username is not none
      - tesseract_email_username is not none
      - tesseract_email_host is not none
      - tesseract_email_port is not none
      - tesseract_email_password is not none
      - scrutiny_version is not none

- name: Ensure tesseract user exists.
  ansible.builtin.user:
    name: "{{ tesseract_username }}"

- name: Checking if architecture is amd64.
  ansible.builtin.set_fact:
    download_arch: "amd64"
  when: '"x86_64" in ansible_facts["architecture"]'

- name: Checking if architecture is arm64
  ansible.builtin.set_fact:
    download_arch: "arm64"
  when: '"armv" in ansible_facts["architecture"] or "aarch" in ansible_facts["architecture"]'

- name: Setting architecture to armhf.
  ansible.builtin.set_fact:
    download_arch: "arm-7"
  when: '"armv7l" in ansible_facts["architecture"]'

- name: Install smartmontools, cron and netcat.
  ansible.builtin.apt:
    pkg:
      - smartmontools
      - cron
      - netcat-openbsd
    update_cache: true

- name: Configure InfluxDB.
  ansible.builtin.include_tasks:
    file: influxdb.yml

- name: Configure Scrutiny.
  ansible.builtin.include_tasks:
    file: scrutiny.yml
