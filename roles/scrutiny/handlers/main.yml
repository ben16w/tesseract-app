---

- name: Restart influxdb service.
  ansible.builtin.systemd:
    name: influxdb.service
    state: restarted
    daemon_reload: true
  listen: restart influxdb

- name: Restart scrutiny service.
  ansible.builtin.systemd:
    name: scrutiny.service
    state: restarted
    daemon_reload: true
  listen: restart scrutiny
