---

- name: Assert that all required inputs have been provided.
  ansible.builtin.assert:
    that:
      - llama_cpp_version is not none
      - llama_cpp_models | length > 0

- name: Assert that llama.cpp model definitions are valid.
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.url | default('') | regex_search('^https?://') is not none
      - item.url | default('') | regex_search('.*\.gguf$') is not none
    fail_msg: "llama_cpp_models entries must define a name and a valid HTTP/HTTPS URL ending with .gguf"
  loop: "{{ llama_cpp_models }}"

- name: Ensure tesseract user exists.
  register: tesseract_user_details
  ansible.builtin.user:
    name: "{{ tesseract_username }}"

- name: Ensure runtime packages are installed.
  ansible.builtin.package:
    name:
      - libgomp1
    update_cache: true

- name: Check installed llama.cpp version.
  ansible.builtin.slurp:
    src: /usr/local/share/llama_cpp_version
  register: llama_cpp_installed_version
  failed_when: false

- name: Build and install llama.cpp if required.
  when: (llama_cpp_installed_version.content | default('') | b64decode).strip() != llama_cpp_version
  notify: restart llama-server
  block:
    - name: Ensure build packages are installed.
      ansible.builtin.package:
        name: >-
          {{ ['build-essential', 'cmake', 'git', 'ninja-build'] +
             (['libvulkan-dev', 'glslc', 'spirv-headers'] if llama_cpp_use_vulkan else []) }}
        update_cache: true

    - name: Create build directory.
      ansible.builtin.file:
        path: /tmp/llama_cpp_build
        state: directory
        mode: '0755'

    - name: Download llama.cpp source.
      ansible.builtin.get_url:
        url: "https://github.com/ggml-org/llama.cpp/archive/refs/tags/{{ llama_cpp_version }}.tar.gz"
        dest: "/tmp/llama_cpp_build/llama.cpp-{{ llama_cpp_version }}.tar.gz"
        force: true
        owner: root
        group: root
        mode: '0644'
      register: download_llama_cpp_src
      retries: 5
      delay: 10
      until: download_llama_cpp_src is succeeded

    - name: Extract llama.cpp source.
      ansible.builtin.unarchive:
        src: "/tmp/llama_cpp_build/llama.cpp-{{ llama_cpp_version }}.tar.gz"
        dest: /tmp/llama_cpp_build
        remote_src: true

    - name: Configure llama.cpp build.
      ansible.builtin.command:
        cmd: >-
          cmake -GNinja
          -S /tmp/llama_cpp_build/llama.cpp-{{ llama_cpp_version }}
          -B /tmp/llama_cpp_build/build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          {{ '-DGGML_NATIVE=ON' if llama_cpp_native else '' }}
          {{ '-DGGML_VULKAN=ON' if llama_cpp_use_vulkan else '' }}
          {{ '-DGGML_HIP=ON' if llama_cpp_use_rocm else '' }}
        creates: /tmp/llama_cpp_build/build/build.ninja
      changed_when: true

    - name: Build llama-server.
      ansible.builtin.shell:
        cmd: "cmake --build /tmp/llama_cpp_build/build --target llama-server -j $(nproc)"
        creates: /tmp/llama_cpp_build/build/bin/llama-server
      changed_when: true

    - name: Install llama-server binary.
      ansible.builtin.copy:
        src: /tmp/llama_cpp_build/build/bin/llama-server
        dest: /usr/local/bin/llama-server
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Remove build directory.
      ansible.builtin.file:
        path: /tmp/llama_cpp_build
        state: absent

    - name: Record installed llama.cpp version.
      ansible.builtin.copy:
        content: "{{ llama_cpp_version }}"
        dest: /usr/local/share/llama_cpp_version
        owner: root
        group: root
        mode: '0644'

- name: Ensure models directory exists.
  ansible.builtin.file:
    path: "{{ llama_cpp_models_dir }}"
    state: directory
    owner: "{{ tesseract_username }}"
    group: "{{ tesseract_username }}"
    mode: '0755'

- name: Download model files if not present.
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ llama_cpp_models_dir }}/{{ item.name }}.gguf"
    owner: "{{ tesseract_username }}"
    group: "{{ tesseract_username }}"
    mode: '0644'
  loop: "{{ llama_cpp_models }}"
  register: download_model
  retries: 5
  delay: 10
  until: download_model is succeeded

- name: Copy llama-server.service template to /etc/systemd/system.
  ansible.builtin.template:
    src: templates/llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    owner: root
    group: root
    mode: '0644'
  notify: restart llama-server

- name: Start and enable llama-server service.
  ansible.builtin.service:
    name: llama-server
    state: started
    enabled: true
