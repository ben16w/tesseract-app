---
- name: Prepare
  hosts: all
  tasks:
    - name: Make sure /usr/share/man/man1/ exists, otherwise Java install will fail.
      ansible.builtin.file:
        path: /usr/share/man/man1/
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install udev and kmod for Wolf tasks.
      ansible.builtin.package:
        name:
          - udev
          - kmod
        update_cache: true

    - name: Ensure udev is started.
      ansible.builtin.service:
        name: systemd-udevd
        state: started
      failed_when: false
