---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  tasks:
    - name: Check netdata service is running.
      ansible.builtin.service:
        name: netdata
        state: started
      check_mode: true
      register: netdata_service
      failed_when: (netdata_service is changed) or (netdata_service is failed)

    - name: Check netdata is listening on the configured port.
      ansible.builtin.wait_for:
        port: "{{ netdata_port }}"
        host: 127.0.0.1
        timeout: 30

    - name: Check netdata API responds.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netdata_port }}/api/v1/info"
        method: GET
        status_code: 200
      register: netdata_info

    - name: Assert netdata API returned version information.
      ansible.builtin.assert:
        that:
          - netdata_info.json.version is defined

    - name: Wait for system.cpu metrics to be available.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netdata_port }}/api/v1/data?chart=system.cpu&after=-60&points=1&format=json"
        method: GET
        status_code: 200
        return_content: true
      register: netdata_metrics
      retries: 5
      delay: 10
      until: >
        netdata_metrics.json is defined
        and netdata_metrics.json.data is defined
        and (netdata_metrics.json.data | length > 0)

    - name: Fetch running netdata.conf from the agent.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netdata_port }}/netdata.conf"
        method: GET
        status_code: 200
        return_content: true
      register: netdata_runtime_conf

    - name: Assert runtime config reflects role overrides.
      ansible.builtin.assert:
        that:
          - "'default port = ' ~ (netdata_port | string) in netdata_runtime_conf.content"
          - "'update every = ' ~ (netdata_update_every | string) in netdata_runtime_conf.content"
        fail_msg: "running netdata.conf is missing expected port/update every overrides"
