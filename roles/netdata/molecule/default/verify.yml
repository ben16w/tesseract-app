---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  tasks:
    - name: Check netdata service is running.
      ansible.builtin.service:
        name: netdata
        state: started
      check_mode: true
      register: netdata_service
      failed_when: (netdata_service is changed) or (netdata_service is failed)

    - name: Check netdata is listening on the configured port.
      ansible.builtin.wait_for:
        port: "{{ netdata_port }}"
        host: 127.0.0.1
        timeout: 30

    - name: Check netdata API responds.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netdata_port }}/api/v1/info"
        method: GET
        status_code: 200
      register: netdata_info

    - name: Assert netdata API returned version information.
      ansible.builtin.assert:
        that:
          - netdata_info.json.version is defined

    - name: Read netdata.conf.
      ansible.builtin.slurp:
        src: /etc/netdata/netdata.conf
      register: netdata_conf

    - name: Verify netdata.conf contains expected overrides.
      ansible.builtin.assert:
        that:
          - "'[web]' in netdata_conf_content"
          - "'default port = ' ~ (netdata_port | string) in netdata_conf_content"
          - "'bind to = *' in netdata_conf_content"
          - "'[db]' in netdata_conf_content"
          - "'update every = ' ~ (netdata_update_every | string) in netdata_conf_content"
        fail_msg: "netdata.conf is missing expected [web]/[db] overrides"
      vars:
        netdata_conf_content: "{{ netdata_conf.content | b64decode }}"

    - name: Check msmtp sendmail path is configured.
      ansible.builtin.command:
        cmd: grep -E "^sendmail='/usr/bin/msmtp'" /etc/netdata/health_alarm_notify.conf
      changed_when: false

    - name: Read docker health alerts config.
      ansible.builtin.slurp:
        src: /etc/netdata/health.d/docker.conf
      register: docker_health_conf

    - name: Verify docker health alerts are critical and container-down is enabled.
      ansible.builtin.assert:
        that:
          - "'template: docker_container_unhealthy' in docker_health_content"
          - "'template: docker_container_down' in docker_health_content"
          - "'crit: $this > 0' in docker_health_content"
          - "'chart labels: container_name=' ~ netdata_docker_down_containers in docker_health_content"
          - "'warn: $this > 0' not in docker_health_content"
        fail_msg: "docker health.d alerts are missing expected critical/down overrides"
      vars:
        docker_health_content: "{{ docker_health_conf.content | b64decode }}"

    - name: Check claim.conf exists with secure ownership.
      ansible.builtin.stat:
        path: /etc/netdata/claim.conf
      register: claim_conf
      failed_when: >
        (not claim_conf.stat.exists) or
        (claim_conf.stat.mode != '0640') or
        (claim_conf.stat.pw_name != 'root') or
        (claim_conf.stat.gr_name != 'netdata')

    - name: Read claim.conf.
      ansible.builtin.slurp:
        src: /etc/netdata/claim.conf
      register: claim_conf_slurp

    - name: Verify claim.conf contains token and rooms.
      ansible.builtin.assert:
        that:
          - "'[global]' in claim_conf_content"
          - "'token = {{ netdata_token }}' in claim_conf_content"
          - "'rooms = {{ netdata_rooms }}' in claim_conf_content"
          - "'url = https://app.netdata.cloud' in claim_conf_content"
        fail_msg: "claim.conf is missing expected claiming settings"
      vars:
        claim_conf_content: "{{ claim_conf_slurp.content | b64decode }}"
