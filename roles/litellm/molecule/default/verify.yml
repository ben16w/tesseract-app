---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  tasks:

    # Services

    - name: Check LiteLLM is listening on the correct port.
      ansible.builtin.wait_for:
        port: "{{ litellm_port }}"
        state: started
        timeout: 10

    - name: Check Headroom is listening on the correct port.
      ansible.builtin.wait_for:
        port: "{{ litellm_headroom_port }}"
        state: started
        timeout: 10

    # LiteLLM API

    - name: Check unauthenticated model list request is rejected.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/models"
        method: GET
        return_content: true
        status_code: 500
      register: model_list_response

    - name: Check authenticated model list request succeeds.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/models"
        method: GET
        return_content: true
        status_code: 200
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
      register: model_list_response_key

    - name: Send chat completion request to mock-llm.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/chat/completions"
        method: POST
        body_format: json
        status_code: 200
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
          Content-Type: "application/json"
        body:
          model: "mock-llm"
          messages:
            - role: "user"
              content: "Hello, mock-llm!"
      register: mock_llm_response

    - name: Assert mock-llm returned expected reply.
      ansible.builtin.assert:
        that:
          - mock_llm_response.json is defined
          - >
            mock_llm_response.json.choices[0].message.content ==
            "I don't know the answer to that. This is a mock response."

    # MCP proxy

    - name: Call npm MCP add tool through LiteLLM proxy.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/npm_mock_mcp/mcp"
        method: POST
        body_format: json
        return_content: true
        status_code: 200
        headers:
          Accept: "application/json, text/event-stream"
          Content-Type: "application/json"
          x-litellm-api-key: "Bearer {{ litellm_master_key }}"
        body:
          jsonrpc: "2.0"
          id: 3
          method: tools/call
          params:
            name: add
            arguments:
              a: 2
              b: 2
      register: litellm_mcp_tool_call_response

    - name: Assert LiteLLM proxies npm MCP requests successfully.
      ansible.builtin.assert:
        that:
          - "'The sum of 2 and 2 is 4' in litellm_mcp_tool_call_response.content"

    - name: Call uv MCP calculate tool through LiteLLM proxy.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/uv_mock_mcp/mcp"
        method: POST
        body_format: json
        return_content: true
        status_code: 200
        headers:
          Accept: "application/json, text/event-stream"
          Content-Type: "application/json"
          x-litellm-api-key: "Bearer {{ litellm_master_key }}"
        body:
          jsonrpc: "2.0"
          id: 3
          method: tools/call
          params:
            name: calculate
            arguments:
              expression: "2+2"
      register: litellm_uv_mcp_tool_call_response

    - name: Assert LiteLLM proxies uv MCP requests successfully.
      ansible.builtin.assert:
        that:
          - "'4' in litellm_uv_mcp_tool_call_response.content"

    # Headroom compression

    - name: Build large tool output payload for Headroom compression.
      ansible.builtin.set_fact:
        headroom_tool_output: >-
          {{ ([{'id': 0, 'status': 'ok', 'message': 'all good', 'value': 0}] * 2500 +
          [{'id': 2501, 'status': 'error', 'message': 'database timeout on shard 7', 'value': -1}]) | to_json }}

    - name: Send chat completion request with large tool output history.
      ansible.builtin.uri:
        url: "http://localhost:{{ litellm_port }}/chat/completions"
        method: POST
        body_format: json
        status_code: 200
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
          Content-Type: "application/json"
        body:
          model: "mock-llm"
          messages:
            - role: "user"
              content: "Get the records."
            - role: "assistant"
              content: ""
              tool_calls:
                - id: "call_1"
                  type: "function"
                  function:
                    name: "get_records"
                    arguments: "{}"
            - role: "tool"
              tool_call_id: "call_1"
              content: "{{ headroom_tool_output }}"
      register: headroom_compression_response

    - name: Assert Headroom compressed the large tool output request.
      ansible.builtin.assert:
        that:
          - headroom_compression_response.json is defined
          - >
            headroom_compression_response.json.choices[0].message.content ==
            "I don't know the answer to that. This is a mock response."
          - headroom_compression_response.json.usage.prompt_tokens < 5000

    # Logs

    - name: Check LiteLLM proxy log exists.
      ansible.builtin.stat:
        path: /var/log/litellm/proxy.log
      register: log_file
      failed_when: not log_file.stat.exists

    - name: Read LiteLLM log.
      ansible.builtin.slurp:
        src: /var/log/litellm/proxy.log
      register: litellm_log

    - name: Assert log is clean and headroom was called.
      ansible.builtin.assert:
        that:
          - "'Headroom: compressed' in litellm_log.content | b64decode"
          - "':ERROR:' not in litellm_log.content | b64decode"
          - "':CRITICAL:' not in litellm_log.content | b64decode"
          - "'POST /chat/completions HTTP/1.1\" 500' not in litellm_log.content | b64decode"

    - name: Check Headroom requests log exists.
      ansible.builtin.stat:
        path: /var/log/litellm/headroom-requests.jsonl
      register: headroom_requests_file
      failed_when: not headroom_requests_file.stat.exists

    - name: Read headroom requests log.
      ansible.builtin.slurp:
        src: /var/log/litellm/headroom-requests.jsonl
      register: headroom_requests_log

    - name: Assert headroom requests log shows compression occurred.
      vars:
        headroom_log_entries: >-
          {{ (headroom_requests_log.content | b64decode).splitlines()
            | reject('equalto', '')
            | map('from_json')
            | list }}
      ansible.builtin.assert:
        that:
          - headroom_log_entries | selectattr('tokens_saved', 'gt', 0) | list | length > 0
